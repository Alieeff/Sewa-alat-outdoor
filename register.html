<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Jejak Sewa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">Jejak<span>Sewa</span></a>
  <div class="navlinks" id="nav-links"></div>
</nav>
<div class="contour"></div>
<div class="container" style="max-width:420px;">
  <h2>Buat akun</h2>
  <div class="panel-box" style="margin-top:20px;">
    <form id="register-form">
      <label>Nama lengkap</label>
      <input type="text" id="nama" required>
      <label>Nomor HP</label>
      <input type="tel" id="no_hp" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Kata sandi (min. 6 karakter)</label>
      <input type="password" id="password" minlength="6" required>
      <button type="submit" class="btn block" style="margin-top:20px;">Daftar</button>
    </form>
    <div id="msg"></div>
    <p class="mono" style="margin-top:16px; font-size:.85rem; color:var(--text-dim);">Sudah punya akun? <a href="login.html" style="color:var(--accent-light)">Masuk di sini</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="common.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nama = document.getElementById('nama').value;
  const no_hp = document.getElementById('no_hp').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { msg.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
  if (data.user) {
    const { error: profileError } = await supabaseClient.from('profiles').insert({
      id: data.user.id, nama, no_hp, email
    });
    if (profileError) { msg.innerHTML = `<div class="msg error">${profileError.message}</div>`; return; }
  }
  msg.innerHTML = `<div class="msg success">Pendaftaran berhasil! Mengarahkan ke halaman masuk...</div>`;
  setTimeout(() => window.location.href = 'login.html', 1500);
});
setupNavbar();
</script>
</body>
</html>
